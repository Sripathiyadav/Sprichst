<!DOCTYPE html>
<html>
<head>
  <meta name="theme-color" content="#f2eae1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1f1d1c" media="(prefers-color-scheme: dark)">
  <!-- Google sign-in on the web goes through Firebase (popup), so the Google
       Identity Services script and its client-id meta tag are not needed. They
       would send every visitor's IP address to Google on page load. -->
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Sprichst: learn German with lessons, flashcards, games and a personal tutor.">
  <!-- Do not tell other sites which page the learner came from. -->
  <meta name="referrer" content="no-referrer">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Sprichst">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Sprichst</title>
  <link rel="manifest" href="manifest.json">
  <!-- Something to look at while the app downloads, so the page is never blank. -->
  <style>
    body { margin: 0; background: #f2eae1; color: #1f1d1c; font-family: system-ui, sans-serif; }
    @media (prefers-color-scheme: dark) { body { background: #1f1d1c; color: #f2eae1; } }
    #boot { position: fixed; inset: 0; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 16px; }
    #boot b { font-size: 28px; letter-spacing: .5px; }
    #boot i { width: 28px; height: 28px; border-radius: 50%; border: 3px solid currentColor;
              border-top-color: transparent; animation: spin .9s linear infinite; opacity: .6; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { #boot i { animation: none; } }
  </style>
</head>
<body>
  <div id="boot" role="status" aria-live="polite"><b>Sprichst</b><i aria-hidden="true"></i><span>Loading…</span></div>
  <noscript>Sprichst needs JavaScript to run. Please turn it on and reload the page.</noscript>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
