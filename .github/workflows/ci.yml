name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Placeholder Firebase configuration (the real files are not in Git)
        run: python3 scripts/ci_firebase_stub.py
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Third-party notices are current
        run: python3 scripts/generate_third_party_notices.py --check
      - name: Course content is valid
        run: python3 scripts/validate_curriculum.py
      - name: Web build
        run: flutter build web --release

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Placeholder Firebase configuration (the real files are not in Git)
        run: python3 scripts/ci_firebase_stub.py
      - run: flutter pub get
      - run: flutter build apk --release

  ai-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q
